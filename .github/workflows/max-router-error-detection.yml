name: Max Router - Deteksi Error

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-backend:
    name: Audit Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Verify runtime exports
        run: |
          node --input-type=module - <<'NODE'
          import * as manager from './dist/mitm/manager.js';
          import * as dns from './dist/mitm/dns/dnsConfig.js';

          const requiredManager = [
            'getCachedPassword',
            'setCachedPassword',
            'initDbHooks',
            'loadEncryptedPassword',
            'saveMitmSettings'
          ];
          const requiredDns = ['execWithPassword'];

          for (const name of requiredManager) {
            if (typeof manager[name] !== 'function') {
              throw new Error(`Missing manager export: ${name}`);
            }
          }

          for (const name of requiredDns) {
            if (typeof dns[name] !== 'function') {
              throw new Error(`Missing DNS export: ${name}`);
            }
          }

          console.log('Runtime export audit: OK');
          NODE

      - name: Start smoke test
        run: |
          timeout 20s npm start > /tmp/max-router-start.log 2>&1 &
          PID=$!
          sleep 5
          if ! kill -0 $PID 2>/dev/null; then
            cat /tmp/max-router-start.log
            exit 1
          fi
          cat /tmp/max-router-start.log
          kill $PID || true

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: max-router-error-log
          path: /tmp/max-router-start.log
          if-no-files-found: ignore
