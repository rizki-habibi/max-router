name: Max Router - Deteksi Error

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-backend:
    name: Audit Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Verify runtime exports
        run: |
          node --input-type=module - <<'NODE'
          const manager = await import('./dist/mitm/manager.js');
          const dns = await import('./dist/mitm/dns/dnsConfig.js');

          for (const name of ['getCachedPassword','setCachedPassword','initDbHooks','loadEncryptedPassword','saveMitmSettings']) {
            if (typeof manager[name] !== 'function') throw new Error('Missing manager export: ' + name);
          }
          if (typeof dns.execWithPassword !== 'function') throw new Error('Missing DNS export: execWithPassword');
          console.log('Runtime export audit: OK');
          NODE

      - name: Verify provider and database support
        run: |
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';

          const root = path.resolve('./dist');
          const files = [];
          function walk(dir) {
            for (const entry of fs.readdirSync(dir, {withFileTypes:true})) {
              const full = path.join(dir, entry.name);
              if (entry.isDirectory()) walk(full);
              else if (/\.(js|mjs)$/.test(entry.name)) files.push(full);
            }
          }
          walk(root);
          const source = files.map(f => fs.readFileSync(f,'utf8')).join('\n');

          const checks = [
            ['Antigravity provider', 'antigravity'],
            ['Antigravity fetchAvailableModels endpoint', 'v1internal:fetchAvailableModels'],
            ['Antigravity object-model parser', 'Object.entries(data.models)'],
            ['Provider connections API', '/api/providers'],
            ['Model endpoint', '/models'],
            ['PostgreSQL adapter', 'createPostgresAdapter'],
            ['DATABASE_URL', 'process.env.DATABASE_URL']
          ];

          for (const [label, needle] of checks) {
            if (!source.includes(needle)) throw new Error('Provider/DB audit gagal: ' + label);
            console.log('OK:', label);
          }

          if (source.includes('v1internal:models')) {
            throw new Error('Antigravity masih memakai endpoint lama v1internal:models');
          }

          // The canonical endpoint may only be declared in the centralized
          // Antigravity constants module; this prevents URL drift between modules.
          const constantsPath = path.resolve('./dist/lib/constants/antigravity.js');
          if (!fs.existsSync(constantsPath)) {
            throw new Error('Antigravity constants module tidak ditemukan: ' + constantsPath);
          }
          const constantsSource = fs.readFileSync(constantsPath, 'utf8');
          if (!constantsSource.includes('https://cloudcode-pa.googleapis.com')) {
            throw new Error('Canonical Antigravity Base URL tidak ditemukan di constants module');
          }

          const forbiddenLegacy = [
            'https://daily-cloudcode-pa.googleapis.com',
            'https://daily-cloudcode-pa.sandbox.googleapis.com',
            'https://cloudcode-pa.googleapis.com/v1internal:fetchAvailableModels',
            'https://cloudcode-pa.googleapis.com/v1internal:loadCodeAssist',
            'https://cloudcode-pa.googleapis.com/v1internal:onboardUser',
            'https://cloudcode-pa.googleapis.com/v1internal:generateContent',
            'https://cloudcode-pa.googleapis.com/v1internal:streamGenerateContent'
          ];
          for (const needle of forbiddenLegacy) {
            const hits = files.filter(f => f !== constantsPath && fs.readFileSync(f, 'utf8').includes(needle));
            if (hits.length) {
              throw new Error('Antigravity endpoint hardcoded di luar constants: ' + needle + ' -> ' + hits.join(', '));
            }
          }

          console.log('Provider + database + Antigravity endpoint audit: OK');
          console.warn('INFO: Railway production wajib menyediakan DATABASE_URL atau persistent Volume agar koneksi OAuth tidak hilang saat redeploy.');
          NODE

      - name: Import every route module
        run: |
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';

          const root = path.resolve('./dist');
          const routes = [];
          function walk(dir) {
            for (const entry of fs.readdirSync(dir, {withFileTypes:true})) {
              const full = path.join(dir, entry.name);
              if (entry.isDirectory()) walk(full);
              else if (entry.name === 'route.js') routes.push(full);
            }
          }
          walk(root);

          let failed = 0;
          for (const file of routes) {
            try {
              await import('file://' + file);
            } catch (error) {
              failed++;
              console.error('ROUTE_IMPORT_FAILED:', path.relative(root,file));
              console.error(error?.stack || error);
            }
          }
          console.log('Route modules checked:', routes.length);
          if (failed) throw new Error(failed + ' route module(s) failed to import');
          NODE



      - name: Deep OAuth and runtime static audit
        run: |
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';

          const required = [
            'src/lib/oauth/antigravity-pkce.js',
            'src/lib/oauth/providers.js',
            'src/lib/oauth/utils/server.js',
          ];

          for (const file of required) {
            if (!fs.existsSync(file)) throw new Error('Missing required OAuth file: ' + file);
          }

          const helper = fs.readFileSync('src/lib/oauth/antigravity-pkce.js', 'utf8');
          const providers = fs.readFileSync('src/lib/oauth/providers.js', 'utf8');
          const server = fs.readFileSync('src/lib/oauth/utils/server.js', 'utf8');

          const requiredPatterns = [
            ['PKCE S256 challenge', 'code_challenge_method'],
            ['PKCE verifier', 'code_verifier'],
            ['Antigravity token endpoint', 'tokenUrl'],
            ['Antigravity canonical base', 'ANTIGRAVITY_CONFIG'],
            ['clear session', 'clearAntigravitySession'],
            ['session verifier storage', 'codeVerifier'],
          ];

          for (const [label, needle] of requiredPatterns) {
            const combined = helper + '\n' + providers + '\n' + server;
            if (!combined.includes(needle)) throw new Error('OAuth audit gagal: ' + label);
          }

          if (!helper.includes('code_challenge_method: "S256"')) {
            throw new Error('Antigravity PKCE wajib menggunakan S256');
          }
          if (!helper.includes('code_verifier: codeVerifier')) {
            throw new Error('Antigravity token exchange tidak mengirim code_verifier');
          }
          if (!server.includes('registerAntigravitySession({ state, codeVerifier, redirectUri })')) {
            throw new Error('Callback proxy tidak menyimpan PKCE verifier');
          }
          if (!server.includes('session.codeVerifier')) {
            throw new Error('Callback proxy tidak memakai verifier dari session');
          }

          // Detect accidental use of the legacy non-PKCE Antigravity handler.
          const agBlockStart = providers.indexOf('  antigravity: {');
          const agBlockEnd = providers.indexOf('  iflow: {', agBlockStart);
          if (agBlockStart < 0 || agBlockEnd < 0) throw new Error('Antigravity provider block tidak ditemukan');
          const agBlock = providers.slice(agBlockStart, agBlockEnd);
          if (agBlock.includes('flowType: "authorization_code"')) {
            console.warn('WARNING: legacy Antigravity provider block masih authorization_code; route PKCE override tetap wajib dipakai.');
          }

          console.log('Deep OAuth static audit: OK');
          NODE

      - name: Compile-only runtime import audit
        run: |
          node --input-type=module - <<'NODE'
          const modules = [
            './dist/lib/oauth/antigravity-pkce.js',
            './dist/lib/oauth/providers.js',
            './dist/lib/oauth/utils/server.js',
            './dist/routes/oauth/[provider]/[action]/route.js'
          ];
          for (const mod of modules) {
            try {
              await import(mod);
              console.log('IMPORT_OK:', mod);
            } catch (error) {
              console.error('IMPORT_FAILED:', mod);
              console.error(error?.stack || error);
              process.exitCode = 1;
            }
          }
          if (process.exitCode) throw new Error('One or more OAuth runtime modules failed to import');
          NODE

      - name: Validate production database guard
        run: |
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          const candidates = [
            'src/lib/db/driver.js',
            'src/lib/db/driver.ts',
            'src/lib/localDb.js',
            'src/lib/localDb.ts'
          ];
          const existing = candidates.filter(fs.existsSync);
          const source = existing.map(f => fs.readFileSync(f, 'utf8')).join('\n');
          if (!source.includes('DATABASE_URL')) throw new Error('DATABASE_URL guard tidak ditemukan');
          if (!source.includes('ALLOW_EPHEMERAL_SQLITE')) throw new Error('Production SQLite escape hatch/guard tidak ditemukan');
          console.log('Production DB persistence audit: OK');
          NODE

      - name: Start smoke test
        env:
          NODE_ENV: test
          PORT: 20222
        run: |
          timeout 20s npm start > /tmp/max-router-start.log 2>&1 &
          PID=$!
          sleep 5
          if ! kill -0 $PID 2>/dev/null; then
            cat /tmp/max-router-start.log
            exit 1
          fi
          cat /tmp/max-router-start.log
          kill $PID || true

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: max-router-error-log
          path: /tmp/max-router-start.log
          if-no-files-found: ignore

  audit-frontend:
    name: Audit Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install --no-audit --no-fund

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Verify Uji Model page
        working-directory: frontend
        run: |
          test -f src/pages/basic-chat/BasicChatPageClient.jsx
          grep -q '/api/providers' src/pages/basic-chat/BasicChatPageClient.jsx
          grep -q '/api/dashboard/chat/completions' src/pages/basic-chat/BasicChatPageClient.jsx
          echo "Uji Model page audit: OK"
