name: Max Router - Deteksi Error

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-backend:
    name: Audit Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Verify required runtime exports
        run: |
          node --input-type=module - <<'NODE'
          const manager = await import('./dist/mitm/manager.js');
          const dns = await import('./dist/mitm/dns/dnsConfig.js');

          const requiredManager = [
            'getCachedPassword',
            'setCachedPassword',
            'initDbHooks',
            'loadEncryptedPassword',
            'saveMitmSettings'
          ];
          const requiredDns = ['execWithPassword'];

          for (const name of requiredManager) {
            if (typeof manager[name] !== 'function') {
              throw new Error(`Missing manager export: ${name}`);
            }
          }

          for (const name of requiredDns) {
            if (typeof dns[name] !== 'function') {
              throw new Error(`Missing DNS export: ${name}`);
            }
          }

          console.log('Runtime export audit: OK');
          NODE

      - name: Import every route module
        run: |
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          const root = path.resolve('./dist');
          const routes = [];
          function walk(dir) {
            for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
              const full = path.join(dir, entry.name);
              if (entry.isDirectory()) walk(full);
              else if (entry.name === 'route.js') routes.push(full);
            }
          }
          walk(root);
          let failed = 0;
          for (const file of routes) {
            try {
              await import('file://' + file);
            } catch (error) {
              failed++;
              console.error(`ROUTE_IMPORT_FAILED: ${path.relative(root, file)}`);
              console.error(error?.stack || error);
            }
          }
          console.log(`Route modules checked: ${routes.length}`);
          if (failed) throw new Error(`${failed} route module(s) failed to import`);
          NODE

      - name: Start smoke test
        env:
          NODE_ENV: test
          PORT: 20222
        run: |
          timeout 20s npm start > /tmp/max-router-start.log 2>&1 &
          PID=$!
          sleep 5
          if ! kill -0 $PID 2>/dev/null; then
            cat /tmp/max-router-start.log
            exit 1
          fi
          cat /tmp/max-router-start.log
          kill $PID || true

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: max-router-error-log
          path: /tmp/max-router-start.log
          if-no-files-found: ignore
